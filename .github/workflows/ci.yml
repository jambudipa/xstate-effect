name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Lint, type check, build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # The published package supports Node 20+ (engines), but the dev toolchain does not:
        # Vitest 5 needs Node ^22.12.0 || ^24.0.0 and ESLint 10 needs ^22.13.0 || >=24.
        node-version: [22.x, 24.x]

    defaults:
      run:
        working-directory: packages/core

    steps:
    # The test suite needs a git checkout: CONF-8 lists the repository's files with git
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: packages/core/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    # Every declaration carries JSDoc and every source folder a README (see packages/core/README.md)
    - name: Docs audit
      run: pnpm run docs:audit

    - name: Test the docs audit
      run: node --test scripts/docs-audit.test.mjs

    - name: Type check
      run: pnpm typecheck

    - name: Type check the tests
      run: pnpm exec tsc -p tsconfig.test.json --noEmit

    - name: Build
      run: pnpm build

    - name: Test
      run: pnpm test
      env:
        CI: true

    - name: Check package contents
      run: npm pack --dry-run --ignore-scripts
